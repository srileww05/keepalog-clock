<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink:#22303C; --mute:#6D7B88; --line:#DDE3E8;
    --gold:#D9A21B; --teal:#2A9D8F; --blue:#3D8BD4; --slate:#4B6A9B; --orange:#F2891F; --pink:#C94C84; --red:#E5483B; --star:#F7C21B;
    --s-yellow:#FFE27A; --s-green:#B5E3A8; --s-blue:#A9D3F5; --s-orange:#FFC48C; --s-pink:#F8B4CD; --s-purple:#D2BDF2;
  }
  * { box-sizing: border-box; }
  body { width: 360px; margin: 0; background: #fff; color: var(--ink);
         font: 13px/1.35 "Segoe UI", system-ui, sans-serif; }
  .wrap { position: relative; }
  .stripe { display: flex; height: 8px; }
  .stripe i { flex: 1; }
  .wrap { padding: 12px 14px 14px; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .top h1 { font-size: 16px; margin: 0; font-weight: 800; letter-spacing: -.2px; }
  .star { width: 20px; height: 20px; flex: none; }

  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 10px; font-weight: 700;
           color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  button:hover { filter: brightness(1.07); }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .seg { display: flex; gap: 6px; margin-bottom: 8px; }
  .seg button { flex: 1; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .seg button.on { background: var(--slate); color: #fff; box-shadow: none; }
  .mins { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 8px; color: var(--mute); }
  .mins input { width: 70px; padding: 6px 8px; border: 2px solid var(--line); border-radius: 8px; font: inherit; font-weight: 700; color: var(--ink); }

  .face { border-radius: 12px; padding: 14px 12px 12px; text-align: center; margin-bottom: 10px;
          background: var(--slate); color: #fff; }
  .face[data-s="run"] { background: var(--teal); }
  .face[data-s="pause"] { background: var(--gold); color: var(--ink); }
  .time { font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1.5px; line-height: 1.1; }
  .sub { min-height: 18px; opacity: .92; font-weight: 600; }

  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row > * { flex: 1; }
  .b-start, .b-resume { background: var(--teal); }
  .b-pause { background: var(--orange); }
  .b-flag { background: var(--gold); color: var(--ink); }
  .b-stop { background: var(--red); }
  .b-restart { background: var(--blue); }
  .b-a1 { background: var(--blue); }
  .b-a5 { background: var(--slate); }

  .hd { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; font-weight: 800; font-size: 14px; }
  .hd button { padding: 3px 10px; font-size: 12px; background: #fff; color: var(--mute); box-shadow: inset 0 0 0 2px var(--line); }
  #log { max-height: 270px; overflow-y: auto; padding: 2px 2px 6px; }

  .sess { border-radius: 12px; padding: 10px; margin-bottom: 10px; color: #fff; }
  .sess.c0 { background: var(--gold); color: var(--ink); }
  .sess.c1 { background: var(--teal); }
  .sess.c2 { background: var(--blue); }
  .sess.c3 { background: var(--orange); }
  .sess.c4 { background: var(--slate); }
  .sess.c5 { background: var(--pink); }
  .sh { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 8px; }
  .sh span { font-weight: 600; font-variant-numeric: tabular-nums; opacity: .92; }
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

  .note { position: relative; background: var(--s-yellow); color: var(--ink); padding: 7px 8px 8px; border-radius: 3px;
          box-shadow: 0 2px 4px rgba(0,0,0,.22); transform: rotate(-1.2deg); }
  .note:nth-child(even) { transform: rotate(1deg); }
  .note:nth-child(3n) { transform: rotate(.4deg); }
  .note b { display: block; font-size: 12.5px; }
  .note .c { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .note .e { font-size: 11px; opacity: .72; font-variant-numeric: tabular-nums; }
  .note.start { background: var(--s-green); }
  .note.pause { background: var(--s-orange); }
  .note.resume { background: var(--s-blue); }
  .note.stop { background: var(--s-pink); }
  .note.add { background: var(--s-purple); }
  .note.restart { background: #9ADFD3; }
  .note.end { background: var(--s-pink); }
  .note.flag { background: var(--s-yellow); }
  .note .star { position: absolute; top: -9px; right: -7px; width: 22px; height: 22px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
  .empty { background: var(--s-yellow); padding: 10px; border-radius: 3px; box-shadow: 0 2px 4px rgba(0,0,0,.15); transform: rotate(-.8deg); color: var(--ink); }
  .note.warn { background: #FFB8A8; }
  .note.limit { background: #F58C86; }
  .note.snooze { background: var(--s-blue); }
  .gear { margin-left: auto; padding: 5px 7px; line-height: 0; background: #fff;
          box-shadow: inset 0 0 0 2px var(--line); border-radius: 8px; }
  .gear svg { width: 18px; height: 18px; }
  .settings { position: absolute; left: 14px; right: 14px; top: 46px; z-index: 5; background: #fff;
              border-radius: 12px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.25), 0 0 0 2px var(--line); }
  .settings label { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 6px; }
  .settings input { width: 64px; padding: 5px 7px; border: 2px solid var(--line); border-radius: 8px; font: inherit; font-weight: 700; color: var(--ink); }
  .settings .hint { color: var(--mute); font-size: 11.5px; }
  .hide { display: none !important; }
</style>
</head>
<body>
  <div class="stripe">
    <i style="background:var(--red)"></i><i style="background:var(--orange)"></i><i style="background:var(--gold)"></i>
    <i style="background:var(--teal)"></i><i style="background:var(--blue)"></i><i style="background:var(--slate)"></i>
  </div>
  <div class="wrap">
    <div class="top">
      <svg class="star" viewBox="0 0 24 24"><polygon points="12,1.5 15.1,8.3 22.5,9.1 17,14.1 18.5,21.4 12,17.7 5.5,21.4 7,14.1 1.5,9.1 8.9,8.3" fill="#F7C21B" stroke="#E39A0B" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <h1>Flow Log</h1>
      <button class="gear" id="gear" title="Alert settings" aria-label="Alert settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22303C" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2" fill="#fff"/><circle cx="15" cy="12" r="2" fill="#fff"/><circle cx="8" cy="17" r="2" fill="#fff"/></svg>
      </button>
    </div>
    <div id="settings" class="settings hide">
      <label>Warn every <span><input id="cfg-warn" type="number" min="0.1" step="0.5"> hrs</span></label>
      <label>Auto-pause at <span><input id="cfg-limit" type="number" min="0.2" step="0.5"> hrs</span></label>
      <label>Snooze for <span><input id="cfg-snooze" type="number" min="1" step="5"> min</span></label>
      <div class="hint">Stopwatch only. Warnings pop up near the taskbar.</div>
    </div>

    <div id="modes" class="seg">
      <button id="m-sw" class="on">Stopwatch</button>
      <button id="m-tm">Timer</button>
    </div>
    <div id="minsWrap" class="mins hide"><input id="mins" type="number" min="1" value="25"> minutes</div>

    <div id="face" class="face" data-s="idle">
      <div id="disp" class="time">00:00</div>
      <div id="sub" class="sub"></div>
    </div>

    <div class="row" id="idle"><button class="b-start" id="start">Start</button></div>
    <div class="row hide" id="run">
      <button class="b-pause" id="pause">Pause</button>
      <button class="b-flag" id="lap">Flag</button>
      <button class="b-restart" id="restart">Restart</button>
      <button class="b-stop" id="stop">Stop</button>
    </div>
    <div class="row hide" id="paused">
      <button class="b-resume" id="resume">Resume</button>
      <button class="b-restart" id="restart2">Restart</button>
      <button class="b-stop" id="stop2">Stop</button>
    </div>
    <div class="row hide" id="add">
      <button class="b-a1" id="a1">+1 min</button>
      <button class="b-a5" id="a5">+5 min</button>
    </div>

    <div class="hd"><span>Log</span><button id="clear">Clear</button></div>
    <div id="log"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
